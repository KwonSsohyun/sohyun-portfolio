<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8" />
    <title>Kwonsohyun Portfolio</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="stylesheet" href="/css/common.css">
    <link rel="stylesheet" href="/sohyun-portfolio/css/common.css">

    <link rel="icon" href="https://kwonssohyun.github.io/sohyun-portfolio/favicon.ico" />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="Kwonsohyun Portfolio" />
    <meta property="og:description" content="UX/UI · BX · FE Portfolio" />
    <meta property="og:url" content="https://kwonssohyun.github.io/sohyun-portfolio/" />
    <meta property="og:image" content="https://kwonssohyun.github.io/sohyun-portfolio/og.png" /> 

    <style>
        .project-header {
        max-width: 1200px;
        margin: 0 auto;
        padding: 80px 30px;
        }

        /* 제목 */
        .project-title {
        font-size: 28px;
        font-weight: 700;
        margin-bottom: 40px;
        }

        /* 핵심 레이아웃 */
        .project-body {
        display: flex;
        justify-content: space-between;
        align-items: flex-start; /* ← 시작선 통일 핵심 */
        gap: 80px;
        }

        /* 설명 */
        .project-desc {
        max-width: 720px;
        font-size: 15px;
        line-height: 1.8;
        color: #666;
        }

        /* 메타 */
        .project-meta {
        list-style: none;
        padding: 0;
        margin: 0;
        min-width: 220px;
        }

        .project-meta li {
        display: flex;
        gap: 24px;
        margin-bottom: 10px;
        font-size: 14px;
        }

        .project-meta li span:first-child {
        font-weight: 700;
        min-width: 80px;
        }

        .project-meta li span:last-child {
        color: #666;
        }

        /* =====================
        Mobile
        ===================== */
        @media (max-width: 768px) {
        .project-header {
            padding: 40px 20px;
        }

        .project-title {
            font-size: 22px;
            margin-bottom: 24px;
        }

        .project-body {
            flex-direction: column;
            gap: 32px;
        }

        .project-desc {
            font-size: 14px;
        }
        }
    </style>
</head>
<body>
    <!-- HEADER -->
    <header class="header">
    <div class="header-inner">
        <h1 class="logo"><a href="https://kwonssohyun.github.io/sohyun-portfolio">Kwonsohyun</a></h1>
        <nav class="nav">
        <a href="https://kwonssohyun.github.io/sohyun-portfolio/#about">About</a>
        <a href="https://kwonssohyun.github.io/sohyun-portfolio/#work">Work</a>
        <a href="https://kwonssohyun.github.io/sohyun-portfolio/#contact">Contact</a>
        </nav>
    </div>
    </header>    



    <section class="project-header">
    <h1 class="project-title">한솥</h1>

    <div class="project-body">
        <p class="project-desc">
            국내 도시락 브랜드 1위 한솥에서<br /> 
            웹·모바일 서비스 UI/UX 디자인과 신규 페이지 기획을 중심으로 근무했습니다.<br /> 
            이벤트 운영에 따른 화면 개선과 함께 기능 개발,<br />  
            데이터 분석, POS·키오스크 프로젝트까지 연계 경험을 쌓았습니다.
        </p>

        <ul class="project-meta">
        <li><span>Client</span><span>한솥</span></li>
        <li><span>Services</span><span>UX/UI, DEV</span></li>
        <li><span>Date</span><span>2022</span></li>
        </ul>
    </div>
    </section>



    <div style="max-width: 1200px; margin: 10px auto; margin-bottom: 100px;">
    <img src="../../assets/images/work/04_hansot/hansot.png" style="width:100%; display:block;">
    </div>



    <!-- CONTACT -->
    <section id="contact" class="contact">
    <div class="container">
        <h3>Contact</h3>

        <div class="contact-row phone">
        <p>+82 10 7163 2261</p>
        </div>

        <div class="contact-row email">
        <p>creative103@naver.com</p>
        </div>
    </div>
    </section>

</body>
</html>
